# Upptime: checks jugger.app from GitHub's servers (outside the home server)
# every 5 minutes. If it goes down, an issue is opened and assigned below;
# it's closed when it's back. https://upptime.js.org/docs/configuration
owner: D-Arguello
repo: jugger-status

sites:
  # The lightest page of the app: if it answers, Next.js is up.
  - name: jugger.app
    url: https://jugger.app/robots.txt

assignees:
  - D-Arguello

status-website:
  baseUrl: /jugger-status
  logoUrl: https://jugger.app/icons/icon-192.png
  favicon: https://jugger.app/icons/icon-192.png
  name: jugger.app status
  introTitle: "**jugger.app** status"
  introMessage: Digital match sheets and tournament brackets for jugger. Checked every 5 minutes from outside the server.
  navbar:
    - title: Status
      href: /
    - title: jugger.app
      href: https://jugger.app
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
